<!DOCTYPE html>
<html lang="en">
<head>
    <script src="theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        .cat-arrival {
            position: relative;
            display: grid;
            align-content: center;
            justify-items: center;
            gap: 0.5rem;
            overflow: hidden;
            width: 100%;
            min-height: 70vh;
            min-height: 70dvh;
            margin: 0;
            padding: clamp(1.5rem, 5vw, 3rem);
            background:
                radial-gradient(ellipse at 50% 70%, var(--primary-light), transparent 55%),
                var(--bg);
            text-align: center;
        }

        .cat-arrival.is-active {
            animation: cat-screen-enter 450ms ease-out both;
        }

        @keyframes cat-screen-enter {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .cat-screen-title {
            margin: 0;
            color: var(--primary-dark);
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            text-align: center !important;
        }

        .cat-stage {
            position: relative;
            width: min(100%, 500px);
            height: min(52vh, 390px);
            min-height: 280px;
        }

        .arrival-cat {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 170px;
            height: 170px;
            opacity: 0;
            transform: translate(-50%, 190px) scale(1.5);
            transform-origin: center bottom;
        }

        .cat-arrival.is-active .arrival-cat {
            animation: cat-pop-up 950ms cubic-bezier(0.2, 0.85, 0.25, 1.2) 150ms forwards;
        }

        @keyframes cat-pop-up {
            0% { opacity: 0; transform: translate(-50%, 190px) scale(1.5); }
            78% { opacity: 1; transform: translate(-50%, -12px) scale(1.5); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1.5); }
        }

        .cat-body {
            position: absolute;
            bottom: -18px;
            left: 28px;
            width: 114px;
            height: 92px;
            border-radius: 55% 55% 20% 20%;
            background: #f5f1e9;
            box-shadow: inset -8px -5px #ded7cb;
        }

        .cat-tail {
            position: absolute;
            right: 8px;
            bottom: 12px;
            width: 58px;
            height: 22px;
            border: 10px solid #ded7cb;
            border-left-color: transparent;
            border-radius: 0 22px 22px 0;
            transform: rotate(-18deg);
        }

        .cat-head {
            position: absolute;
            top: 44px;
            left: 30px;
            width: 110px;
            height: 92px;
            border-radius: 48% 48% 45% 45%;
            background: #fffaf1;
            box-shadow: inset -6px -4px #e9e1d5, 0 5px 12px rgba(23, 50, 77, 0.12);
        }

        .cat-ear {
            position: absolute;
            top: -12px;
            width: 36px;
            height: 42px;
            border: 3px solid #e9e1d5;
            border-radius: 8px 28px 4px 20px;
            background: #fffaf1;
        }

        .cat-ear-left {
            left: 5px;
            transform: rotate(-12deg);
        }

        .cat-ear-right {
            right: 5px;
            transform: rotate(12deg) scaleX(-1);
        }

        .cat-eye {
            position: absolute;
            top: 38px;
            width: 9px;
            height: 12px;
            border-radius: 50%;
            background: #28374a;
        }

        .cat-eye-left { left: 29px; }
        .cat-eye-right { right: 29px; }

        .cat-muzzle {
            position: absolute;
            top: 52px;
            left: 50%;
            width: 28px;
            height: 18px;
            border-radius: 50%;
            background: #f4d6c8;
            transform: translateX(-50%);
        }

        .cat-nose {
            position: absolute;
            top: 54px;
            left: 50%;
            width: 8px;
            height: 6px;
            border-radius: 50% 50% 60% 60%;
            background: #d98f91;
            transform: translateX(-50%);
        }

        .cat-whiskers {
            position: absolute;
            top: 56px;
            width: 24px;
            height: 1px;
            background: #a9a197;
            box-shadow: 0 7px #a9a197;
        }

        .cat-whiskers-left {
            left: 3px;
            transform: rotate(8deg);
        }

        .cat-whiskers-right {
            right: 3px;
            transform: rotate(-8deg);
        }

        .cat-bubble {
            position: absolute;
            z-index: 1;
            top: 0;
            left: 50%;
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            color: var(--primary-dark);
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 700;
            opacity: 0;
            transform: translate(-50%, 8px) scale(0.9);
            white-space: nowrap;
        }

        .cat-arrival.is-active .cat-bubble {
            animation: cat-bubble-pop 350ms ease-out 850ms forwards;
        }

        @keyframes cat-bubble-pop {
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        .cat-status {
            margin: 0.5rem 0 0;
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center !important;
        }

        .arrival-cat {
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }
        .arrival-cat:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 8px;
            border-radius: 20px;
        }
        @media (prefers-reduced-motion: reduce) {
            .cat-arrival.is-active,
            .cat-arrival.is-active .arrival-cat,
            .cat-arrival.is-active .cat-bubble {
                animation-duration: 1ms;
                animation-delay: 0ms;
            }
        }
    </style>
</head>
<body>
    <header id="site-header"></header>
    <main class="cat-arrival is-active" id="cat-arrival" aria-labelledby="cat-screen-title">
        <h1 class="cat-screen-title" id="cat-screen-title" tabindex="-1">A tiny visitor</h1>
        <div class="cat-stage">
            <div class="cat-bubble">Don't touch me.</div>
            <button class="arrival-cat" id="arrival-cat" type="button" aria-label="Touch the cat to hear it meow">
                <span class="cat-tail"></span>
                <span class="cat-body"></span>
                <span class="cat-head">
                    <span class="cat-ear cat-ear-left"></span>
                    <span class="cat-ear cat-ear-right"></span>
                    <span class="cat-eye cat-eye-left"></span>
                    <span class="cat-eye cat-eye-right"></span>
                    <span class="cat-muzzle"></span>
                    <span class="cat-nose"></span>
                    <span class="cat-whiskers cat-whiskers-left"></span>
                    <span class="cat-whiskers cat-whiskers-right"></span>
                </span>
            </button>
        </div>
        <p class="cat-status" id="cat-status" aria-live="polite"></p>
    </main>


    <script src="nav.js"></script>
    <script>
        const catStatus = document.getElementById("cat-status");
        function playCatMeow() {
            const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextConstructor) {
                catStatus.textContent = "Your browser does not support the meow sound.";
                return;
            }

            let audioContext;
            try {
                audioContext = new AudioContextConstructor();
            } catch (error) {
                console.warn("Could not create the cat sound.", error);
                catStatus.textContent = "The cat arrived, but its meow could not play.";
                return;
            }

            audioContext.resume().then(() => {
                const startAt = audioContext.currentTime;
                const volume = audioContext.createGain();
                const meow = audioContext.createOscillator();
                const overtone = audioContext.createOscillator();
                const overtoneVolume = audioContext.createGain();

                meow.type = "triangle";
                meow.frequency.setValueAtTime(680, startAt);
                meow.frequency.linearRampToValueAtTime(920, startAt + 0.16);
                meow.frequency.linearRampToValueAtTime(540, startAt + 0.48);
                meow.frequency.linearRampToValueAtTime(620, startAt + 0.72);

                overtone.type = "sine";
                overtone.frequency.setValueAtTime(1360, startAt);
                overtone.frequency.linearRampToValueAtTime(1080, startAt + 0.48);
                overtoneVolume.gain.setValueAtTime(0.12, startAt);
                volume.gain.setValueAtTime(0.0001, startAt);
                volume.gain.linearRampToValueAtTime(0.2, startAt + 0.06);
                volume.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.76);

                meow.connect(volume);
                overtone.connect(overtoneVolume);
                overtoneVolume.connect(volume);
                volume.connect(audioContext.destination);
                meow.start(startAt);
                overtone.start(startAt);
                meow.stop(startAt + 0.8);
                overtone.stop(startAt + 0.8);
                window.setTimeout(() => audioContext.close(), 1000);
            }).catch(error => {
                console.warn("The browser blocked the cat sound.", error);
                catStatus.textContent = "The cat arrived, but your browser blocked the meow sound.";
            });
        }

        document.getElementById("arrival-cat").addEventListener("click", () => {
            catStatus.textContent = "Meow! Don't touch me.";
            playCatMeow();
        });
    </script>
</body>
</html>
